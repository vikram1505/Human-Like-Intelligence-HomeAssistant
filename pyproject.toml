[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pylint.main]
py-version = "3.10"
ignore-paths = ["custom_components/hli/brand"]

[tool.pylint.messages_control]
disable = [
  "import-error",
  "too-few-public-methods",
  "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100
